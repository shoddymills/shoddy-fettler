<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="The tools level: with no configuration file, the launch folder is the tree work, and fettle also opens this session's scratch folder, the client's tool-results and memory folders, and a companion server's root. Older sessions and transcripts stay outside. The client's own file tools are denied, so fettle is the route to a file. The shell stays open at this level.">
  <rect width="640" height="360" fill="#12151b"/>
  <g font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#c9d1dc">

    <!-- the caller -->
    <rect x="20" y="146" width="104" height="54" rx="6" fill="#1c2129" stroke="#5f6b7c"/>
    <text x="72" y="168" text-anchor="middle" fill="#e6edf5">assistant</text>
    <text x="72" y="186" text-anchor="middle" fill="#9aa3b2">or a script</text>

    <rect x="160" y="146" width="96" height="54" rx="6" fill="#1c2129" stroke="#7ec699"/>
    <text x="208" y="168" text-anchor="middle" fill="#7ec699">fettle</text>
    <text x="208" y="186" text-anchor="middle" fill="#9aa3b2">no file needed</text>

    <path d="M124 173 h30" stroke="#9aa3b2" stroke-width="1.5"/>
    <path d="M148 167 l6 6 -6 6" stroke="#9aa3b2" stroke-width="1.5" fill="none"/>

    <!-- the trees open at the tools level -->
    <rect x="292" y="20" width="328" height="250" rx="8" fill="none" stroke="#5f6b7c" stroke-dasharray="5 4"/>
    <text x="304" y="40" fill="#9aa3b2">the trees, at the tools level</text>

    <rect x="306" y="52" width="300" height="40" rx="4" fill="#1c2129"/>
    <text x="318" y="70" fill="#7ec699">work</text>
    <text x="370" y="70" fill="#c9d1dc">the launch folder</text>
    <text x="318" y="85" fill="#9aa3b2">list read create update rename delete</text>

    <rect x="306" y="100" width="300" height="34" rx="4" fill="#1c2129"/>
    <text x="318" y="121" fill="#7ec699">scratch</text>
    <text x="400" y="121" fill="#c9d1dc">this session's folder only</text>

    <rect x="306" y="142" width="300" height="34" rx="4" fill="#1c2129"/>
    <text x="318" y="163" fill="#5fa8de">tool-results</text>
    <text x="430" y="163" fill="#c9d1dc">read-only</text>

    <rect x="306" y="184" width="300" height="34" rx="4" fill="#1c2129"/>
    <text x="318" y="205" fill="#7ec699">memory</text>
    <text x="400" y="205" fill="#c9d1dc">read and write</text>

    <rect x="306" y="226" width="300" height="34" rx="4" fill="#1c2129"/>
    <text x="318" y="247" fill="#d9a066">sparky</text>
    <text x="400" y="247" fill="#c9d1dc">a companion's --root</text>

    <path d="M256 173 h30" stroke="#9aa3b2" stroke-width="1.5"/>
    <path d="M280 167 l6 6 -6 6" stroke="#9aa3b2" stroke-width="1.5" fill="none"/>

    <!-- what stays outside -->
    <rect x="292" y="286" width="328" height="56" rx="6" fill="#1c2129" stroke="#d9534f" stroke-dasharray="3 3"/>
    <text x="304" y="307" fill="#d9534f">outside every tree</text>
    <text x="304" y="327" fill="#9aa3b2">older sessions, transcripts, your home folder</text>

    <text x="20" y="300" fill="#9aa3b2">the built-in file tools denied,</text>
    <text x="20" y="318" fill="#9aa3b2">no tasks, no execute,</text>
    <text x="20" y="336" fill="#9aa3b2">the shell still open</text>
  </g>
</svg>
