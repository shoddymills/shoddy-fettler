<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="The screenings level: a read from a screened tree passes the tier one patterns, then the models burler runs. One detection refuses the whole answer with exit 13. A clean answer is served.">
  <rect width="640" height="300" fill="#12151b"/>
  <g font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#c9d1dc">

    <rect x="20" y="20" width="270" height="82" rx="6" fill="#1c2129" stroke="#5f6b7c"/>
    <text x="32" y="40" fill="#e6edf5">.fettler.json</text>
    <text x="32" y="60" fill="#d9a066">"screenings": {</text>
    <text x="44" y="78" fill="#c9d1dc">"screen": { "records": true }</text>
    <text x="32" y="94" fill="#d9a066">}</text>

    <rect x="20" y="140" width="110" height="50" rx="6" fill="#1c2129" stroke="#5f6b7c"/>
    <text x="75" y="162" text-anchor="middle" fill="#e6edf5">read</text>
    <text x="75" y="180" text-anchor="middle" fill="#9aa3b2">records/a.csv</text>

    <rect x="168" y="140" width="130" height="50" rx="6" fill="#1c2129" stroke="#7ec699"/>
    <text x="233" y="162" text-anchor="middle" fill="#7ec699">tier one</text>
    <text x="233" y="180" text-anchor="middle" fill="#9aa3b2">patterns, in fettle</text>

    <rect x="336" y="140" width="130" height="50" rx="6" fill="#1c2129" stroke="#d9a066"/>
    <text x="401" y="162" text-anchor="middle" fill="#d9a066">burler</text>
    <text x="401" y="180" text-anchor="middle" fill="#9aa3b2">the models</text>

    <g stroke="#9aa3b2" stroke-width="1.5" fill="none">
      <path d="M130 165 h32"/><path d="M156 159 l6 6 -6 6"/>
      <path d="M298 165 h32"/><path d="M324 159 l6 6 -6 6"/>
      <path d="M466 165 h32"/><path d="M492 159 l6 6 -6 6"/>
    </g>

    <rect x="504" y="122" width="116" height="38" rx="6" fill="#1c2129" stroke="#7ec699"/>
    <text x="562" y="146" text-anchor="middle" fill="#7ec699">served</text>

    <rect x="504" y="172" width="116" height="38" rx="6" fill="#1c2129" stroke="#d9534f"/>
    <text x="562" y="196" text-anchor="middle" fill="#d9534f">exit 13</text>

    <g stroke="#d9534f" stroke-width="1.5" fill="none">
      <path d="M233 190 v40 h329 v-20"/>
      <path d="M401 190 v40"/>
    </g>
    <text x="250" y="250" fill="#9aa3b2">one detection refuses the whole answer</text>
    <text x="20" y="276" fill="#9aa3b2">no models directory named: tier one is the whole screen</text>
  </g>
</svg>
