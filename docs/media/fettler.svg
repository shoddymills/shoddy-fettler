<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A terminal showing two declared trees with their permissions, a search hit, and a path outside the boundary refused">
  <rect width="320" height="200" fill="#12151b"/>
  <rect width="320" height="22" fill="#1c2129"/>
  <circle cx="14" cy="11" r="4" fill="#d9534f"/>
  <circle cx="28" cy="11" r="4" fill="#d9a066"/>
  <circle cx="42" cy="11" r="4" fill="#7ec699"/>

  <!-- the prompt: one command, and it is `roots` - the boundary is the
       first thing this tool has to be able to say out loud -->
  <g>
    <rect x="16" y="34" width="6" height="5" rx="2" fill="#7ec699"/>
    <rect x="28" y="34" width="30" height="5" rx="2" fill="#9aa3b2"/>
    <rect x="64" y="34" width="26" height="5" rx="2" fill="#d9a066"/>
  </g>

  <!-- the boundary itself, drawn as a boundary: everything the tool may
       touch is inside this line, and the line is declared rather than
       discovered -->
  <rect x="14" y="48" width="196" height="138" rx="6" fill="none"
        stroke="#5f6b7c" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- tree one: the folder the configuration sits in, so it is writable -
       six permissions, and never the seventh -->
  <g>
    <rect x="28" y="62" width="168" height="52" rx="4" fill="#1c2129"/>
    <rect x="40" y="74" width="42" height="6" rx="3" fill="#7ec699"/>
    <rect x="90" y="74" width="72" height="6" rx="3" fill="#5f6b7c"/>
    <g fill="#3c4657">
      <rect x="40" y="92" width="20" height="6" rx="3"/>
      <rect x="66" y="92" width="24" height="6" rx="3"/>
      <rect x="96" y="92" width="28" height="6" rx="3"/>
      <rect x="130" y="92" width="26" height="6" rx="3"/>
      <rect x="162" y="92" width="22" height="6" rx="3"/>
    </g>
  </g>

  <!-- tree two: somebody else's, so list and read and nothing more -->
  <g>
    <rect x="28" y="124" width="168" height="48" rx="4" fill="#1c2129"/>
    <rect x="40" y="136" width="56" height="6" rx="3" fill="#5fa8de"/>
    <rect x="104" y="136" width="58" height="6" rx="3" fill="#5f6b7c"/>
    <g fill="#3c4657">
      <rect x="40" y="154" width="20" height="6" rx="3"/>
      <rect x="66" y="154" width="24" height="6" rx="3"/>
    </g>
  </g>

  <!-- a path from outside, stopped at the line rather than after it -->
  <g>
    <rect x="258" y="96" width="44" height="54" rx="3" fill="#1c2129"/>
    <g fill="#5f6b7c">
      <rect x="268" y="110" width="24" height="4" rx="2"/>
      <rect x="268" y="120" width="18" height="4" rx="2"/>
      <rect x="268" y="130" width="22" height="4" rx="2"/>
    </g>
  </g>

  <g stroke="#d9534f" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M254 123 l-24 0"/>
    <path d="M236 117 l-6 6 6 6"/>
    <path d="M214 115 l12 16"/>
    <path d="M226 115 l-12 16"/>
  </g>
</svg>
