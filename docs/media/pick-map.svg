<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" role="img"
  aria-label="A map of a SQL Server as pick sees it. The whole server is one hatched area meaning out of bounds by default. Inside it, one database, Sales, is lit: dbo.Orders may be selected and described, dbo.Customers may be selected without its ssn and dob columns which do not exist here, dbo.TopCustomers is a view whose columns answer and whose stored text never does, and the audit schema is sealed and never even listed. The rest of the server is dark: the system databases, an adjacent undeclared database, the system catalog, and linked servers. A strip across the bottom of the server names the login pick connects as, granted only SELECT and VIEW DEFINITION. Below the server is the one way in: pick, carrying one SELECT at a time, parsed whole, rewritten three-part and screened on the way back; beside it, everything else - there is no shell, no EXEC, no second statement, and no write verb exists to try.">
<style>
/* Extracted from docs/pick-workstation.html so the figure can stand alone in a README.
   The palette is the site's: madder for what is refused, drab for what is
   granted, indigo for what is read-only, over the unbleached wool ground.
   Kept in step with the page by hand - if the diagram there is restyled,
   re-extract rather than patching one of the two. */
svg{
  --madder:#6E3A33; --drab:#55604A; --indigo:#2F4560;
  --ink:#2E2A26; --ink-soft:#5b544a; --line:#ddd6c6; --line-soft:#e7e2d5;
  --paper:#efece4; --card:#f8f6f0; --code-bg:#e9e5da; --code-ink:#33302b;
  --drab-tint:#e5e8dc; --indigo-tint:#e0e5ec; --madder-tint:#ecdfda;
  --dim:#e7e4da; --brick:#e3cfc8;
}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:Consolas,"Cascadia Code",ui-monospace,Menlo,monospace}
.t-title{font-size:31px; font-weight:800; fill:var(--ink)}
.t-sub{font-size:15.5px; fill:var(--ink-soft)}
.t-frame{font-size:13.5px; font-weight:800; fill:var(--paper); letter-spacing:.1em}
.t-zone{font-size:13.5px; font-weight:800; fill:var(--ink-soft); letter-spacing:.09em}
.t-inN{font-size:16px; font-weight:750; fill:var(--drab)}
.t-outN{font-size:15px; font-weight:700; fill:var(--madder)}
.t-body{font-size:12.5px; fill:var(--ink)}
.t-dim{font-size:12.5px; fill:var(--ink-soft)}
.t-perm{font-size:12px; font-weight:700; fill:var(--drab); letter-spacing:.03em}
.t-tag{font-size:11.5px; font-weight:700; fill:var(--madder); letter-spacing:.05em}
.t-ro{font-size:12px; font-weight:700; fill:var(--indigo); letter-spacing:.03em}
.pill{font-size:10.5px; font-weight:800; fill:var(--paper); letter-spacing:.11em}
.t-legend{font-size:13px; fill:var(--ink)}
</style>
<rect width="100%" height="100%" fill="var(--card)"/>
<defs>
  <pattern id="pmHatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="8" stroke="var(--line)" stroke-width="1.5"/>
  </pattern>
  <pattern id="pmHatchR" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="7" height="7" fill="var(--dim)"/>
    <line x1="0" y1="0" x2="0" y2="7" stroke="#dcc9c2" stroke-width="1.6"/>
  </pattern>
  <marker id="pmArrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--drab)"/>
  </marker>
  <g id="pmYes">
    <circle r="12" fill="var(--drab-tint)" stroke="var(--drab)" stroke-width="1.7"/>
    <path d="M -5.4,0.6 L -1.6,4.8 L 5.8,-4.4" fill="none" stroke="var(--drab)"
      stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="pmNo">
    <circle r="11" fill="var(--madder-tint)" stroke="var(--madder)" stroke-width="1.6"/>
    <path d="M -4.4,-4.4 L 4.4,4.4 M 4.4,-4.4 L -4.4,4.4" fill="none" stroke="var(--madder)"
      stroke-width="2.6" stroke-linecap="round"/>
  </g>
</defs>

<text x="44" y="50" class="t-title">The server, and the one way onto it</text>
<text x="44" y="80" class="t-sub">One database in bounds, one statement at a time in &#8212; and everything else answers as if it were not there.</text>

<rect x="80" y="108" width="1120" height="532" rx="12" fill="url(#pmHatch)" stroke="var(--line)" stroke-width="1.4"/>
<rect x="80" y="108" width="1120" height="34" rx="12" fill="var(--ink-soft)"/>
<rect x="80" y="126" width="1120" height="16" fill="var(--ink-soft)"/>
<text x="100" y="131" class="t-frame">warehouse &#183; A SQL SERVER &#183; OUT OF BOUNDS UNLESS THE LIST SAYS OTHERWISE</text>

<text x="96" y="172" class="t-zone">THE DECLARED DATABASE</text>

<rect x="96" y="182" width="644" height="330" rx="8" fill="var(--drab-tint)" stroke="var(--drab)" stroke-width="2.4"/>
<use href="#pmYes" x="124" y="213"/>
<text x="146" y="208" class="t-inN mono">Sales</text>
<text x="146" y="230" class="t-body">The one database on the list &#8212; and the list is the whole world.</text>
<text x="440" y="208" class="t-perm">LIST &#183; SELECT &#183; DESCRIBE</text>

<rect x="118" y="246" width="296" height="80" rx="7" fill="var(--card)" stroke="var(--drab)" stroke-width="2"/>
<use href="#pmYes" x="144" y="275"/>
<text x="166" y="271" class="t-inN mono" style="font-size:13.5px">dbo.Orders</text>
<text x="166" y="291" class="t-body">Selected and described.</text>
<text x="166" y="311" class="t-perm">EVERY COLUMN</text>

<rect x="426" y="246" width="296" height="80" rx="7" fill="var(--card)" stroke="var(--drab)" stroke-width="2"/>
<use href="#pmYes" x="452" y="275"/>
<text x="474" y="271" class="t-inN mono" style="font-size:13.5px">dbo.Customers</text>
<text x="474" y="291" class="t-body">Selected, without two columns.</text>
<text x="474" y="311" class="t-tag">ssn AND dob DO NOT EXIST HERE</text>

<rect x="118" y="340" width="296" height="80" rx="7" fill="var(--card)" stroke="var(--drab)" stroke-width="2"/>
<use href="#pmYes" x="144" y="369"/>
<text x="166" y="365" class="t-inN mono" style="font-size:13.5px">dbo.TopCustomers</text>
<text x="166" y="385" class="t-body">A view: its columns answer.</text>
<text x="166" y="405" class="t-tag">ITS STORED TEXT NEVER DOES</text>

<rect x="426" y="340" width="296" height="80" rx="7" fill="var(--madder-tint)" stroke="var(--madder)"
  stroke-width="1.6" stroke-dasharray="5 4"/>
<use href="#pmNo" x="452" y="369"/>
<text x="474" y="365" class="t-outN mono" style="font-size:13.5px">audit.*</text>
<text x="474" y="391" class="t-tag">SEALED &#183; NEVER EVEN LISTED</text>

<text x="118" y="452" class="t-dim">A scope replaces what the database grants; the most specific decides.</text>
<text x="118" y="472" class="t-dim">Hidden and absent answer in the same words, so a refusal maps nothing.</text>

<text x="768" y="172" class="t-zone">THE REST OF THE SERVER</text>

<rect x="768" y="182" width="416" height="70" rx="8" fill="var(--madder-tint)" stroke="var(--madder)"
  stroke-width="1.8" stroke-dasharray="6 5"/>
<use href="#pmNo" x="794" y="217"/>
<text x="816" y="212" class="t-outN mono" style="font-size:14px">master &#183; msdb &#183; tempdb</text>
<text x="816" y="234" class="t-dim">The system databases &#8212; not on the list.</text>

<rect x="768" y="264" width="416" height="70" rx="8" fill="var(--madder-tint)" stroke="var(--madder)"
  stroke-width="1.8" stroke-dasharray="6 5"/>
<use href="#pmNo" x="794" y="299"/>
<text x="816" y="294" class="t-outN mono" style="font-size:14px">OtherDb</text>
<text x="816" y="316" class="t-dim">Real, adjacent, undeclared &#8212; simply not on the list.</text>

<rect x="768" y="346" width="416" height="84" rx="8" fill="var(--madder-tint)" stroke="var(--madder)"
  stroke-width="1.8" stroke-dasharray="6 5"/>
<use href="#pmNo" x="794" y="381"/>
<text x="816" y="376" class="t-outN mono" style="font-size:14px">sys.* &#183; INFORMATION_SCHEMA</text>
<text x="816" y="398" class="t-dim">The catalog that would answer everything.</text>
<text x="816" y="418" class="t-tag">describe ANSWERS INSTEAD, GOVERNED BY THE SCOPES</text>

<rect x="768" y="442" width="416" height="70" rx="8" fill="var(--madder-tint)" stroke="var(--madder)"
  stroke-width="1.8" stroke-dasharray="6 5"/>
<use href="#pmNo" x="794" y="477"/>
<text x="816" y="472" class="t-outN mono" style="font-size:14px">OtherServer.OtherDb..</text>
<text x="816" y="494" class="t-dim">A linked server is a second server wearing a prefix.</text>

<rect x="96" y="540" width="1088" height="76" rx="8" fill="var(--indigo-tint)" stroke="var(--indigo)" stroke-width="2"/>
<text x="118" y="566" class="t-inN mono" style="fill:var(--indigo)">the login underneath it all</text>
<text x="118" y="590" class="t-ro">GRANTED ONLY SELECT AND VIEW DEFINITION</text>
<text x="520" y="566" class="t-dim">The server keeps its own boundary: even a fault in pick has nothing wider</text>
<text x="520" y="586" class="t-dim">to spend &#8212; and a login failure reports as the server declining, not the gate.</text>

<path d="M 284,690 V 646" stroke="var(--drab)" stroke-width="5" fill="none" marker-end="url(#pmArrG)"/>
<rect x="270" y="634" width="28" height="12" fill="var(--drab)"/>

<rect x="104" y="690" width="380" height="120" rx="8" fill="var(--drab-tint)" stroke="var(--drab)" stroke-width="2.2"/>
<rect x="104" y="690" width="110" height="19" rx="4" fill="var(--drab)"/>
<text x="159" y="704" text-anchor="middle" class="pill">THE ONE WAY IN</text>
<text x="122" y="738" class="t-inN mono">pick &#8212; one SELECT at a time</text>
<text x="122" y="760" class="t-dim">Parsed whole, rewritten three-part, screened on the way back.</text>
<text x="122" y="784" class="t-perm">NO SHELL &#183; NO EXEC &#183; NO SECOND STATEMENT</text>

<rect x="520" y="690" width="440" height="120" rx="8" fill="url(#pmHatchR)" stroke="var(--madder)"
  stroke-width="2" stroke-dasharray="6 5"/>
<use href="#pmNo" x="546" y="722"/>
<text x="568" y="718" class="t-outN">Every other way in</text>
<text x="546" y="746" class="t-dim">There is no write verb to try, no OPENROWSET to smuggle a</text>
<text x="546" y="766" class="t-dim">connection through, and no route that reaches the dark blocks &#8212;</text>
<text x="546" y="786" class="t-dim">and no answer ever admits they are there.</text>

<use href="#pmYes" x="96" y="862"/>
<text x="116" y="867" class="t-legend">In bounds</text>
<use href="#pmNo" x="216" y="862"/>
<text x="234" y="867" class="t-legend">Out of bounds &#8212; and invisible: asking returns <tspan style="font-style:italic">no such table or view</tspan></text>
<path d="M 700,862 H 730" stroke="var(--drab)" stroke-width="5" fill="none"/>
<text x="740" y="867" class="t-legend">the one way in a person wrote down</text>
</svg>
