<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="The three levels of pick. Tools is first and always on: the file names a server and its connection, and that gives the five verbs, the query gate and the caps over every database the login can reach. Guardrails is second and turns on when the file has a guardrails section: only declared databases exist, with scopes and hidden columns. Screenings is third and turns on when the file has a screenings section: it refuses answers that disclose regulated data. On the left, .picker.json with one section per level.">
  <rect width="640" height="360" fill="#12151b"/>
  <g font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#c9d1dc">

    <text x="20" y="36" fill="#9aa3b2">one file, three sections</text>
    <text x="260" y="36" fill="#9aa3b2">three levels</text>

    <!-- the file -->
    <rect x="20" y="50" width="210" height="280" rx="6" fill="#1c2129" stroke="#5f6b7c"/>
    <text x="32" y="72" fill="#e6edf5">.picker.json</text>
    <text x="32" y="104" fill="#7ec699">"tools": { "servers" }</text>
    <text x="32" y="122" fill="#9aa3b2">the section is required:</text>
    <text x="32" y="138" fill="#9aa3b2">it names the server</text>
    <text x="32" y="202" fill="#5fa8de">"guardrails": { ... }</text>
    <text x="32" y="292" fill="#d9a066">"screenings": { ... }</text>

    <!-- arrows from each section to its level -->
    <g stroke="#9aa3b2" stroke-width="1.5" fill="none">
      <path d="M230 100 h22"/><path d="M246 94 l6 6 -6 6"/>
      <path d="M230 198 h22"/><path d="M246 192 l6 6 -6 6"/>
      <path d="M230 288 h22"/><path d="M246 282 l6 6 -6 6"/>
    </g>

    <!-- tools, first -->
    <rect x="260" y="50" width="360" height="100" rx="6" fill="#1c2129" stroke="#7ec699"/>
    <text x="272" y="72" fill="#7ec699">tools</text>
    <text x="608" y="72" text-anchor="end" fill="#9aa3b2">always on</text>
    <text x="272" y="92" fill="#c9d1dc">catalogs objects select describe doctor</text>
    <text x="272" y="110" fill="#9aa3b2">the query gate, the caps, no default database</text>
    <text x="272" y="128" fill="#9aa3b2">every database the login can reach</text>

    <!-- guardrails, second -->
    <rect x="260" y="160" width="360" height="76" rx="6" fill="#1c2129" stroke="#5fa8de"/>
    <text x="272" y="182" fill="#5fa8de">guardrails</text>
    <text x="608" y="182" text-anchor="end" fill="#9aa3b2">optional</text>
    <text x="272" y="202" fill="#c9d1dc">on when the file has this section</text>
    <text x="272" y="220" fill="#9aa3b2">only declared databases exist; hidden columns</text>

    <!-- screenings, third -->
    <rect x="260" y="250" width="360" height="76" rx="6" fill="#1c2129" stroke="#d9a066"/>
    <text x="272" y="272" fill="#d9a066">screenings</text>
    <text x="608" y="272" text-anchor="end" fill="#9aa3b2">optional</text>
    <text x="272" y="292" fill="#c9d1dc">on when the file has this section</text>
    <text x="272" y="310" fill="#9aa3b2">refuses answers that disclose regulated data</text>
  </g>
</svg>
