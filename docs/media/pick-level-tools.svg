<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-label="The pick tools level: a .picker.json with only a tools section names a server and its connection. Every query passes the gate: one SELECT, no second statement, no sys catalog, no linked server, no write. Every database the login can reach is there.">
  <rect width="640" height="320" fill="#12151b"/>
  <g font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#c9d1dc">

    <rect x="20" y="20" width="290" height="82" rx="6" fill="#1c2129" stroke="#5f6b7c"/>
    <text x="32" y="40" fill="#e6edf5">.picker.json</text>
    <text x="32" y="60" fill="#d9a066">"tools": { "servers": {</text>
    <text x="44" y="78" fill="#c9d1dc">"main": { "connect": "env:MAIN_SQL" }</text>
    <text x="32" y="94" fill="#d9a066">} }</text>

    <rect x="20" y="140" width="110" height="50" rx="6" fill="#1c2129" stroke="#5f6b7c"/>
    <text x="75" y="162" text-anchor="middle" fill="#e6edf5">assistant</text>
    <text x="75" y="180" text-anchor="middle" fill="#9aa3b2">or a script</text>

    <rect x="168" y="124" width="190" height="122" rx="6" fill="#1c2129" stroke="#7ec699"/>
    <text x="180" y="144" fill="#7ec699">pick: the query gate</text>
    <text x="180" y="166" fill="#c9d1dc">one SELECT, parsed whole</text>
    <text x="180" y="184" fill="#c9d1dc">no second statement</text>
    <text x="180" y="202" fill="#c9d1dc">no sys.*, no linked server</text>
    <text x="180" y="220" fill="#c9d1dc">no write verb</text>

    <g stroke="#9aa3b2" stroke-width="1.5" fill="none">
      <path d="M130 165 h32"/><path d="M156 159 l6 6 -6 6"/>
      <path d="M358 185 h32"/><path d="M384 179 l6 6 -6 6"/>
    </g>

    <rect x="396" y="124" width="224" height="122" rx="8" fill="none" stroke="#5f6b7c" stroke-dasharray="5 4"/>
    <text x="408" y="144" fill="#9aa3b2">server main</text>
    <rect x="408" y="156" width="200" height="22" rx="3" fill="#1c2129"/>
    <text x="418" y="171" fill="#7ec699">Sales</text>
    <rect x="408" y="184" width="200" height="22" rx="3" fill="#1c2129"/>
    <text x="418" y="199" fill="#7ec699">Finance</text>
    <text x="408" y="232" fill="#9aa3b2">every database the login</text>
    <text x="408" y="246" fill="#9aa3b2">can reach</text>

    <text x="20" y="290" fill="#9aa3b2">no databases declared, no scopes, no column rules</text>
  </g>
</svg>
