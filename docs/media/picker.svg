<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="A terminal showing one declared database with its grants and scoped objects, and a query naming an undeclared database refused">
  <rect width="320" height="200" fill="#12151b"/>
  <rect width="320" height="22" fill="#1c2129"/>
  <circle cx="14" cy="11" r="4" fill="#d9534f"/>
  <circle cx="28" cy="11" r="4" fill="#d9a066"/>
  <circle cx="42" cy="11" r="4" fill="#7ec699"/>

  <!-- the prompt: one command, and it is `catalogs` - the boundary is the
       first thing this tool has to be able to say out loud -->
  <g>
    <rect x="16" y="34" width="6" height="5" rx="2" fill="#7ec699"/>
    <rect x="28" y="34" width="24" height="5" rx="2" fill="#9aa3b2"/>
    <rect x="58" y="34" width="42" height="5" rx="2" fill="#d9a066"/>
  </g>

  <!-- the boundary itself, drawn as a boundary: the declared database is
       inside this line, and the line is declared rather than discovered -->
  <rect x="14" y="48" width="196" height="138" rx="6" fill="none"
        stroke="#5f6b7c" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- the one declared database: its name, its verbs, and inside it the
       scoped objects - one row per table, one narrowed, one sealed -->
  <g>
    <rect x="28" y="62" width="168" height="110" rx="4" fill="#1c2129"/>
    <rect x="40" y="74" width="42" height="6" rx="3" fill="#7ec699"/>
    <rect x="90" y="74" width="72" height="6" rx="3" fill="#5f6b7c"/>

    <!-- a table with every column -->
    <rect x="40" y="94" width="52" height="6" rx="3" fill="#5fa8de"/>
    <rect x="100" y="94" width="56" height="6" rx="3" fill="#3c4657"/>

    <!-- a table narrowed by its column scope: part lit, part struck -->
    <rect x="40" y="112" width="52" height="6" rx="3" fill="#5fa8de"/>
    <rect x="100" y="112" width="34" height="6" rx="3" fill="#3c4657"/>
    <rect x="140" y="112" width="22" height="6" rx="3" fill="#3c4657"/>
    <path d="M138 110 l26 10" stroke="#d9534f" stroke-width="1.6"/>

    <!-- a sealed scope: barely there, because it is not there -->
    <rect x="40" y="130" width="52" height="6" rx="3" fill="#2a3140"/>
    <rect x="100" y="130" width="44" height="6" rx="3" fill="#242b38"/>

    <!-- the rows a select answered with -->
    <g fill="#3c4657">
      <rect x="40" y="152" width="20" height="6" rx="3"/>
      <rect x="66" y="152" width="28" height="6" rx="3"/>
      <rect x="100" y="152" width="24" height="6" rx="3"/>
      <rect x="130" y="152" width="30" height="6" rx="3"/>
    </g>
  </g>

  <!-- a query naming an undeclared database, stopped at the line rather
       than after it -->
  <g>
    <rect x="258" y="96" width="44" height="54" rx="3" fill="#1c2129"/>
    <g fill="#5f6b7c">
      <rect x="268" y="110" width="24" height="4" rx="2"/>
      <rect x="268" y="120" width="18" height="4" rx="2"/>
      <rect x="268" y="130" width="22" height="4" rx="2"/>
    </g>
  </g>

  <g stroke="#d9534f" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M254 123 l-24 0"/>
    <path d="M236 117 l-6 6 6 6"/>
    <path d="M214 115 l12 16"/>
    <path d="M226 115 l-12 16"/>
  </g>
</svg>
