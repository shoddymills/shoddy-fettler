name: Release

# Pushing a tag is what ships. scripts/ship.ps1 creates and pushes it; this builds
# from the tag on a clean runner and publishes the GitHub Release.
#
# THE TAG IS THE VERSION. Nothing in the repository records a release
# number: Directory.Build.props carries a development default, and the step
# below passes the tag's version to scripts/build.sh, which passes it to
# `dotnet publish -p:Version=`. So there is no version-bump commit to make,
# no release branch to cut, and nothing to merge back afterwards - the
# sequence that used to need a documented recovery procedure for when it
# died halfway through.
#
# ONE RUNNER, and it is Linux, which is load-bearing rather than
# incidental. The executable bit only survives a tar made on a filesystem
# that has one; an archive cut on Windows cannot record it at all, and a
# fettle that arrives without it does not run. R6.9 is Fettler's own clause
# about exactly this bit, so shipping it wrong would be a poor joke. The
# Windows .zip archives have no such bit to lose and are cut here too.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (X.Y.Z) - does not publish a release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history - the release body names the range

      # The tag is the single source of the version, so it is worth being
      # strict about: anything that is not an exact X.Y.Z would end up
      # stamped into a binary and printed on an archive.
      - name: Read the version from the tag
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version='${{ github.event.inputs.version }}'
            tag="v$version"
          else
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "the tag '$tag' does not carry an exact X.Y.Z version"; exit 1; }
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $tag"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The suite runs again here, on the tagged commit, on a clean machine.
      # CI already proved this commit on Windows and macOS and ship.ps1
      # refuses to tag one CI has not passed - but a release is the one
      # thing that cannot be un-shipped, and this costs minutes.
      - name: Test
        run: ./scripts/build.sh test

      # BOTH programs, 6 RIDs each, 12 archives. The upload below has to
      # name both: an archive that is built and not attached is
      # indistinguishable from one that was never built, except that
      # nothing fails.
      - name: Publish fettle and burler
        run: ./scripts/build.sh publish ${{ steps.ver.outputs.version }}

      # R6.9, asserted rather than assumed, on both programs. burler is
      # launched by fettle as a child process; one that arrives without its
      # execute bit turns every screened read into a refusal that blames
      # the sidecar for not starting.
      - name: The unix archives carry the executable bit
        run: |
          for program in fettle burler; do
            for rid in linux-x64 linux-arm64 osx-x64 osx-arm64; do
              archive="artifacts/publish/$program-${{ steps.ver.outputs.version }}-$rid.tar.gz"
              tar -tvzf "$archive" | grep -q "^-rwx" || {
                echo "$archive carries $program without its execute bit (R6.9)"; exit 1; }
            done
          done
          echo "all unix archives are executable"

      # The number a user sees must be the number on the archive they
      # downloaded. Before the version was stamped at all, every binary
      # reported the MSBuild default of 1.0.0 while the repository shipped
      # something else, which made the smoke test report a figure that meant
      # nothing. This asserts the stamp reached the binary.
      - name: The binary reports the version on the archive
        run: |
          mkdir -p smoke-release
          tar -xzf artifacts/publish/fettle-${{ steps.ver.outputs.version }}-linux-x64.tar.gz \
            -C smoke-release
          reported=$(./smoke-release/fettle --version)
          echo "fettle --version -> $reported"
          echo "$reported" | grep -q '${{ steps.ver.outputs.version }}' || {
            echo "the binary does not report ${{ steps.ver.outputs.version }}"; exit 1; }

      # Every archive must carry both files. The licences oblige it, and an
      # obligation nobody can read has not been met.
      - name: Every archive carries NOTICE and LICENSE
        run: |
          cd artifacts/publish
          for a in fettle-*.tar.gz burler-*.tar.gz; do
            tar -tzf "$a" | grep -q '^NOTICE$'  || { echo "$a has no NOTICE";  exit 1; }
            tar -tzf "$a" | grep -q '^LICENSE$' || { echo "$a has no LICENSE"; exit 1; }
          done
          for a in fettle-*.zip burler-*.zip; do
            unzip -l "$a" | grep -q 'NOTICE'  || { echo "$a has no NOTICE";  exit 1; }
            unzip -l "$a" | grep -q 'LICENSE' || { echo "$a has no LICENSE"; exit 1; }
          done
          echo "all 12 archives carry both"

      # Hand-written notes win. They must be committed BEFORE the tag is
      # pushed, because this job checks out the tag and sees only what that
      # commit contains. ship.ps1 refuses to tag without them, so the
      # fallback here is for a tag pushed by hand.
      - name: Compose the release body
        id: body
        run: |
          notes="release-notes/${{ steps.ver.outputs.tag }}.md"
          if [ -f "$notes" ]; then
            echo "using $notes"
            cp "$notes" BODY.md
          else
            echo "no $notes in the tagged commit - falling back to the merge log"
            previous=$(git describe --tags --abbrev=0 "${{ steps.ver.outputs.tag }}^" 2>/dev/null || true)
            {
              echo "_No release notes were committed for this tag._"
              echo
              echo "## Merged since ${previous:-the beginning}"
              echo
              if [ -n "$previous" ]; then
                git log --no-merges --format='- %s' "$previous..${{ steps.ver.outputs.tag }}"
              else
                git log --no-merges --format='- %s' "${{ steps.ver.outputs.tag }}"
              fi
            } > BODY.md
          fi

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            artifacts/publish/fettle-*.zip \
            artifacts/publish/fettle-*.tar.gz \
            artifacts/publish/burler-*.zip \
            artifacts/publish/burler-*.tar.gz \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes-file BODY.md
