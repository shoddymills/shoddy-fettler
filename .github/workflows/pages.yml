name: Deploy docs to Pages

# Regenerates docs/sitemap.xml (lastmod from git commit dates) and publishes
# docs/ as the Pages site. Requires the repository's Pages source to be set
# to "GitHub Actions" (Settings > Pages); the generated sitemap is a deploy
# artifact and is never committed.
#
# The base URL is NOT passed here. It is defined once, in
# scripts/make-sitemap.sh and its .ps1 twin, so that settling the site's
# address is a one-line change in one place rather than a hunt through a
# workflow, a script and whatever else quoted it.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'scripts/make-sitemap.sh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history - sitemap lastmod comes from git log

      - name: Regenerate the sitemap
        run: sh scripts/make-sitemap.sh docs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
